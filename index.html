<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geografia svizzera</title>
<meta name="description" content="Quiz di geografia: cantoni, capoluoghi, fiumi e laghi della Svizzera e del Ticino.">
<meta name="theme-color" content="#D52B1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Geografia CH">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F6F3;--ink:#1C1C1A;--muted:#5C5C57;--line:#E2E2DD;--btn:#CFCFC9;--red:#D52B1E;--ok:#1F8A4C;--bad:#C8321E;--none:#D7D7D1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1400px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{width:40px;height:40px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
  .sub{margin:2px 0 0;font-size:14px;color:var(--muted)}
  .seg{display:flex;flex-wrap:wrap;gap:6px;padding:4px;background:#ECECE8;border-radius:12px}
  .seg button{min-height:40px;padding:0 14px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:700}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
  .tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .tools .progress{font-size:14px;color:var(--muted);padding:0 6px}
  .btn{min-height:44px;padding:0 16px;border:1.5px solid var(--btn);border-radius:10px;background:#fff;font-size:14px;font-weight:600;color:var(--ink)}
  .btn:hover{background:#ECECE8}
  .btn.primary{border:none;background:var(--red);color:#fff;font-weight:700;padding:0 20px}
  .btn.primary:hover{background:#B9241A}
  .btn.icon{width:44px;padding:0;font-size:20px;font-weight:700}
  .result{display:none;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px 18px;border-radius:12px;background:#fff;border:1.5px solid var(--line)}
  .result.show{display:flex}
  .result .score{font-size:20px;font-weight:800}
  .legend{display:flex;gap:16px;font-size:14px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .main{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .panel{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px}
  .mapPanel{flex:999 1 520px;min-width:0}
  .mapPanel.portrait{flex:1 1 380px;max-width:560px}
  .mapHead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .mapHead p{margin:0;font-size:13px;color:var(--muted);flex:1 1 200px}
  .zoom{display:flex;gap:6px}
  .mapBox{position:relative;width:100%;overflow:hidden;border-radius:10px;background:var(--bg);user-select:none;-webkit-user-select:none;touch-action:pan-y}
  .mapBox.zoomed{touch-action:none}
  .mapBox svg{width:100%;height:100%;display:block}
  .zone{cursor:pointer;stroke:#fff;stroke-width:2;stroke-linejoin:round;transition:fill .15s}
  .zone:hover{filter:brightness(.93)}
  .lake{stroke:#fff;stroke-width:1;stroke-linejoin:round}
  .river{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .hit{cursor:pointer}
  .riverHit{fill:none;stroke:rgba(0,0,0,0);stroke-width:16;pointer-events:stroke;cursor:pointer}
  .pin{stroke:#fff;stroke-width:2.5;cursor:pointer}
  .abbr{font-size:13px;font-weight:700;fill:var(--muted);pointer-events:none}
  .chip{position:absolute;transform:translate(-50%,-50%);padding:3px 8px;border-radius:999px;border:1.5px solid var(--bad);background:#fff;color:var(--bad);font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .chip.up{transform:translate(-50%,-170%)}
  .tray{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:12px}
  .tray h2{margin:0;font-size:16px;font-weight:800}
  .tray .count{font-size:13px;color:var(--muted)}
  .tray .help{margin:0;font-size:13px;color:var(--muted)}
  .cards{display:flex;flex-wrap:wrap;gap:8px}
  .card{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--btn);background:#fff;color:var(--ink);font-size:14px;font-weight:600}
  .card:hover{border-color:var(--ink)}
  .card[aria-pressed="true"]{border-color:var(--red);background:var(--red);color:#fff}
  .errors{display:none;flex-direction:column;gap:6px}
  .errors.show{display:flex}
  .errors h3{margin:4px 0 0;font-size:14px;font-weight:800;color:var(--bad)}
  .errors div{font-size:14px;padding:8px 10px;border-radius:8px;background:#FBF1EF;border:1px solid #F0D4CF}
  .empty{display:none;margin:0;font-size:14px;color:var(--muted);padding:12px 0}
  .empty.show{display:block}
  footer{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
  footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="9.5" y="3" width="5" height="18" fill="#fff"/><rect x="3" y="9.5" width="18" height="5" fill="#fff"/></svg></div>
      <div><h1 id="title">Geografia svizzera</h1><p class="sub" id="subtitle"></p></div>
    </div>
    <nav class="seg" id="mapNav" aria-label="Mappe"></nav>
  </header>

  <div class="row">
    <div class="seg" id="modeNav" role="group" aria-label="Tipo di carte"></div>
    <div class="tools">
      <div class="progress" id="progress"></div>
      <button class="btn" id="hintsBtn" type="button">Mostra sigle</button>
      <button class="btn" id="resetBtn" type="button">Ricomincia</button>
      <button class="btn primary" id="checkBtn" type="button">Verifica</button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="score" id="score"></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Giusto</span><span><i style="background:var(--bad)"></i>Sbagliato</span><span><i style="background:var(--none)"></i>Non piazzato</span></div>
    <div id="checkHint" style="font-size:14px;color:var(--muted)"></div>
  </div>

  <div class="main">
    <section class="panel mapPanel" id="mapPanel" aria-label="Mappa">
      <div class="mapHead">
        <p id="mapHelp"></p>
        <div class="zoom" role="group" aria-label="Zoom">
          <button class="btn icon" id="zoomOut" type="button" aria-label="Riduci">−</button>
          <button class="btn icon" id="zoomIn" type="button" aria-label="Ingrandisci">+</button>
          <button class="btn" id="zoomReset" type="button">Zoom</button>
        </div>
      </div>
      <div class="mapBox" id="mapBox">
        <svg id="svg" role="img" aria-label="Mappa"></svg>
        <div id="chips"></div>
      </div>
    </section>

    <aside class="panel tray" aria-label="Carte">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><h2 id="trayTitle"></h2><span class="count" id="trayCount"></span></div>
      <p class="help" id="trayHelp"></p>
      <div class="errors" id="errors"></div>
      <p class="empty" id="empty">Tutte le carte sono sulla mappa. Premi "Verifica" per vedere com'è andata.</p>
      <div class="cards" id="cards"></div>
    </aside>
  </div>
  <footer>Dati geografici: © swisstopo (swissTLMRegio, swissBOUNDARIES3D); © <a href="https://www.openstreetmap.org/copyright">contributori OpenStreetMap</a> (ODbL). <a href="https://github.com/miguelgila/chgeo">Codice</a> (MIT)<br>Ti è utile? <a href="https://ko-fi.com/miguelgila" rel="noopener">Offrimi un caffè ☕</a></footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  const G=window.GEO; const SVGNS='http://www.w3.org/2000/svg';
  const HUES=[18,48,92,160,200,232,278,328];
  const tint=(i,l,sat)=>'hsl('+HUES[i%HUES.length]+', '+sat+'%, '+l+'%)';
  const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
  const el=id=>document.getElementById(id);

  // ---------- maps & modes ----------
  const CH=G.ch, TI=G.ti;
  const MAPS={
    ch:{label:'Svizzera',title:'Geografia svizzera',w:CH.w,h:CH.h,portrait:false,
      zones:CH.cantons.map(c=>({id:c.abbr,name:c.name,d:c.d,cx:c.cx,cy:c.cy,abbr:c.abbr})),
      lakes:CH.lakes, rivers:CH.rivers, pins:[],
      modes:[
        {id:'cantons',label:'Cantoni',tray:'Cantoni',subtitle:'Metti ogni cantone al suo posto sulla mappa',what:'un cantone',help:'I 26 cantoni della Svizzera.',kind:'zone',targets:()=>CH.cantons.map(c=>({id:c.abbr,name:c.name,cx:c.cx,cy:c.cy})),hints:true},
        {id:'capitals',label:'Capoluoghi',tray:'Capoluoghi',subtitle:'Metti ogni capoluogo sul suo cantone',what:'un cantone',help:'Il capoluogo va messo sul cantone a cui appartiene.',kind:'zone',targets:()=>CH.cantons.map(c=>({id:c.abbr,name:CH.capitals[c.abbr],cx:c.cx,cy:c.cy}))},
        {id:'rivers',label:'Fiumi',tray:'Fiumi',subtitle:'Metti ogni fiume sul suo corso',what:'un fiume',help:'Le linee blu sono i fiumi da trovare. Tocca vicino alla linea.',kind:'river',targets:()=>CH.rivers.map(r=>({id:'r:'+r.name,name:r.name,cx:r.cx,cy:r.cy}))},
        {id:'lakes',label:'Laghi',tray:'Laghi',subtitle:'Metti ogni lago al suo posto',what:'un lago',help:'I laghi principali della Svizzera.',kind:'lake',targets:()=>CH.lakes.map(l=>({id:'l:'+l.name,name:l.name,cx:l.cx,cy:l.cy}))}
      ]},
    ti:{label:'Ticino',title:'Geografia del Ticino',w:TI.w,h:TI.h,portrait:true,
      zones:TI.districts.map(d=>({id:'d:'+d.name,name:d.name,d:d.d,cx:d.cx,cy:d.cy})),
      lakes:TI.lakes, rivers:TI.rivers, pins:TI.cities.map(c=>({id:'c:'+c.name,name:c.name,cx:c.cx,cy:c.cy})),
      modes:[
        {id:'districts',label:'Distretti',tray:'Distretti',subtitle:'Metti ogni distretto al suo posto sulla mappa',what:'un distretto',help:'Gli 8 distretti del Canton Ticino.',kind:'zone',targets:()=>TI.districts.map(d=>({id:'d:'+d.name,name:d.name,cx:d.cx,cy:d.cy}))},
        {id:'cities',label:'Città',tray:'Città e paesi',subtitle:'Metti ogni città sul suo punto della mappa',what:'un punto',help:'I punti grigi sulla mappa sono i luoghi da trovare.',kind:'pin',targets:()=>TI.cities.map(c=>({id:'c:'+c.name,name:c.name,cx:c.cx,cy:c.cy}))},
        {id:'water',label:'Fiumi e laghi',tray:'Fiumi e laghi',subtitle:'Metti ogni fiume e lago al suo posto',what:'un fiume o un lago',help:'Le linee blu sono i fiumi, le aree azzurre i laghi. Tocca vicino alla linea.',kind:'water',targets:()=>TI.rivers.map(r=>({id:'r:'+r.name,name:r.name,cx:r.cx,cy:r.cy})).concat(TI.lakes.map(l=>({id:'l:'+l.name,name:l.name,cx:l.cx,cy:l.cy})))}
      ]}
  };

  // ---------- state ----------
  const S={map:'ch',mode:'cantons',order:[],selected:null,placed:{},checked:false,hints:false,view:{z:1,cx:0,cy:0}};
  const map=()=>MAPS[S.map];
  const mode=()=>map().modes.find(m=>m.id===S.mode);
  let T=[], byId={};
  function fresh(){T=mode().targets();byId={};T.forEach(t=>byId[t.id]=t);S.order=shuffle(T.map(t=>t.id));S.selected=null;S.placed={};S.checked=false;}
  function setMap(id){S.map=id;S.mode=map().modes[0].id;S.view={z:1,cx:map().w/2,cy:map().h/2};fresh();buildSvg();render();try{localStorage.setItem('chgeo.map',id);}catch(e){}}
  function setMode(id){S.mode=id;fresh();render();}

  // ---------- zoom & pan ----------
  const box=el('mapBox'), svg=el('svg');
  const W=()=>map().w, H=()=>map().h;
  function clampView(v){const z=Math.min(Math.max(v.z,1),8);const vw=W()/z,vh=H()/z;return {z,cx:Math.min(Math.max(v.cx,vw/2),W()-vw/2),cy:Math.min(Math.max(v.cy,vh/2),H()-vh/2)};}
  function zoomAt(f,mx,my){const v=S.view;const z=Math.min(Math.max(v.z*f,1),8);const r=v.z/z;
    S.view=clampView({z,cx:mx===undefined?v.cx:mx+(v.cx-mx)*r,cy:my===undefined?v.cy:my+(v.cy-my)*r});applyView();}
  function applyView(){const v=S.view;const vw=W()/v.z,vh=H()/v.z;const vx=v.cx-vw/2,vy=v.cy-vh/2;
    svg.setAttribute('viewBox',vx.toFixed(1)+' '+vy.toFixed(1)+' '+vw.toFixed(1)+' '+vh.toFixed(1));
    box.classList.toggle('zoomed',v.z>1);el('zoomReset').textContent=v.z>1.01?Math.round(v.z*100)+'%':'Zoom';renderChips();}
  const ptrs={};let moved=0,dragged=false;
  box.addEventListener('pointerdown',e=>{ptrs[e.pointerId]={x:e.clientX,y:e.clientY};moved=0;});
  box.addEventListener('pointermove',e=>{const p=ptrs[e.pointerId];if(!p)return;const ids=Object.keys(ptrs);const v=S.view;
    const rect=box.getBoundingClientRect();const unit=(W()/v.z)/rect.width;const vx=v.cx-W()/(2*v.z),vy=v.cy-H()/(2*v.z);
    if(ids.length===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);p.x=e.clientX;p.y=e.clientY;
      if(v.z>1){S.view=clampView({z:v.z,cx:v.cx-dx*unit,cy:v.cy-dy*unit});applyView();}}
    else{const a=ptrs[ids[0]],b=ptrs[ids[1]];const d0=Math.hypot(a.x-b.x,a.y-b.y)||1;p.x=e.clientX;p.y=e.clientY;const d1=Math.hypot(a.x-b.x,a.y-b.y)||1;moved+=20;
      zoomAt(d1/d0,vx+((a.x+b.x)/2-rect.left)*unit,vy+((a.y+b.y)/2-rect.top)*unit);}});
  const up=e=>{delete ptrs[e.pointerId];if(moved>8){dragged=true;setTimeout(()=>{dragged=false;},50);}};
  ['pointerup','pointercancel','pointerleave'].forEach(t=>box.addEventListener(t,up));
  box.addEventListener('wheel',e=>{if(!e.ctrlKey&&S.view.z===1)return;e.preventDefault();const rect=box.getBoundingClientRect();const v=S.view;const unit=(W()/v.z)/rect.width;
    zoomAt(e.deltaY<0?1.2:1/1.2,v.cx-W()/(2*v.z)+(e.clientX-rect.left)*unit,v.cy-H()/(2*v.z)+(e.clientY-rect.top)*unit);},{passive:false});
  el('zoomIn').onclick=()=>zoomAt(1.6);el('zoomOut').onclick=()=>zoomAt(1/1.6);el('zoomReset').onclick=()=>{S.view={z:1,cx:W()/2,cy:H()/2};applyView();};

  // ---------- game actions ----------
  function pickTarget(id){if(S.checked||dragged)return;
    if(S.selected){S.placed[id]=S.selected;S.selected=null;}
    else if(S.placed[id]){delete S.placed[id];}
    render();}
  function pickCard(id){S.selected=S.selected===id?null:id;render();}
  el('resetBtn').onclick=()=>{fresh();render();};
  el('checkBtn').onclick=()=>{S.checked=true;S.selected=null;render();};
  el('hintsBtn').onclick=()=>{S.hints=!S.hints;render();};

  // ---------- SVG build (once per map) ----------
  const nodes={zones:[],lakes:[],rivers:[],riverHits:[],pins:[],abbrs:[]};
  function mk(tag,attrs,cls){const n=document.createElementNS(SVGNS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(cls)n.setAttribute('class',cls);return n;}
  function buildSvg(){svg.innerHTML='';for(const k in nodes)nodes[k]=[];const m=map();
    box.style.aspectRatio=m.w+' / '+m.h;el('mapPanel').classList.toggle('portrait',m.portrait);
    m.zones.forEach(z=>{const n=mk('path',{d:z.d},'zone');n.onclick=()=>pickTarget(z.id);svg.appendChild(n);nodes.zones.push(n);});
    m.lakes.forEach(l=>{const n=mk('path',{d:l.d},'lake');n.onclick=()=>pickTarget('l:'+l.name);svg.appendChild(n);nodes.lakes.push(n);});
    m.rivers.forEach(r=>{const n=mk('path',{d:r.d},'river');svg.appendChild(n);nodes.rivers.push(n);});
    m.rivers.forEach(r=>{const n=mk('path',{d:r.d},'riverHit');n.onclick=()=>pickTarget('r:'+r.name);svg.appendChild(n);nodes.riverHits.push(n);});
    m.pins.forEach(p=>{const n=mk('circle',{cx:p.cx,cy:p.cy,r:11},'pin');n.onclick=()=>pickTarget(p.id);svg.appendChild(n);nodes.pins.push(n);});
    m.zones.forEach(z=>{const n=mk('text',{x:z.cx,y:z.cy,'text-anchor':'middle','dominant-baseline':'central'},'abbr');n.textContent=z.abbr||'';svg.appendChild(n);nodes.abbrs.push(n);});
    applyView();}

  // ---------- render ----------
  function status(id,idle,done,none,counter){const card=S.placed[id];
    if(S.checked){if(card){if(card===id){counter.ok++;return 'var(--ok)';}return 'var(--bad)';}return none;}
    return card?done:idle;}
  function renderChips(){const c=el('chips');c.innerHTML='';if(!S.checked)return;const v=S.view;const vw=W()/v.z,vh=H()/v.z;const vx=v.cx-vw/2,vy=v.cy-vh/2;
    T.filter(t=>S.placed[t.id]&&S.placed[t.id]!==t.id).forEach(t=>{const s=document.createElement('span');s.className='chip'+(mode().kind==='pin'?' up':'');s.textContent=t.name;
      s.style.left=((t.cx-vx)/vw*100).toFixed(2)+'%';s.style.top=((t.cy-vy)/vh*100).toFixed(2)+'%';c.appendChild(s);});}
  function render(){const m=map(),M=mode(),k=M.kind;const cnt={ok:0};
    document.title=m.title;el('title').textContent=m.title;el('subtitle').textContent=M.subtitle;
    const nav=el('mapNav');nav.innerHTML='';Object.keys(MAPS).forEach(id=>{const b=document.createElement('button');b.type='button';b.textContent=MAPS[id].label;b.setAttribute('aria-pressed',id===S.map);b.onclick=()=>setMap(id);nav.appendChild(b);});
    const mn=el('modeNav');mn.innerHTML='';m.modes.forEach(md=>{const b=document.createElement('button');b.type='button';b.textContent=md.label;b.setAttribute('aria-pressed',md.id===S.mode);b.onclick=()=>setMode(md.id);mn.appendChild(b);});
    el('hintsBtn').style.display=M.hints?'':'none';el('hintsBtn').textContent=S.hints?'Nascondi sigle':'Mostra sigle';
    // map colours
    m.zones.forEach((z,i)=>{const n=nodes.zones[i];
      n.setAttribute('fill',k==='zone'?status(z.id,tint(i,88,40),tint(i,58,60),'#E4E4DF',cnt):(k==='pin'?tint(i,92,30):'#EBEBE6'));
      n.style.cursor=k==='zone'?'pointer':'default';});
    m.lakes.forEach((l,i)=>{const n=nodes.lakes[i];const active=k==='lake'||k==='water';
      n.setAttribute('fill',active?status('l:'+l.name,'#9CC3E0',tint(i+5,48,70),'#D7D7D1',cnt):'#BFD7EA');n.style.cursor=active?'pointer':'default';});
    m.rivers.forEach((r,i)=>{const n=nodes.rivers[i];const active=k==='river'||k==='water';
      n.setAttribute('stroke',active?status('r:'+r.name,'#3F7FB5',tint(i,42,75),'#B0B0AA',cnt):'#8FB6D3');
      n.setAttribute('stroke-width',active?(S.placed['r:'+r.name]||S.checked?4.5:3):1.6);nodes.riverHits[i].style.display=active?'':'none';});
    m.pins.forEach((p,i)=>{const n=nodes.pins[i];n.style.display=k==='pin'?'':'none';if(k==='pin')n.setAttribute('fill',status(p.id,'#6B6B66',tint(i,45,70),'#D7D7D1',cnt));});
    nodes.abbrs.forEach(n=>{n.style.display=(S.hints&&M.hints)?'':'none';});
    // cards
    const placedCards=new Set(Object.values(S.placed));const cards=el('cards');cards.innerHTML='';
    const left=S.order.filter(a=>!placedCards.has(a));
    left.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='card';b.textContent=byId[a].name;b.setAttribute('aria-pressed',S.selected===a);b.onclick=()=>pickCard(a);cards.appendChild(b);});
    el('trayTitle').textContent=M.tray;el('trayHelp').textContent=M.help;el('trayCount').textContent=left.length+' rimaste';
    el('empty').classList.toggle('show',left.length===0&&!S.checked);
    el('progress').textContent=Object.keys(S.placed).length+' / '+T.length+' piazzate';
    // results
    el('result').classList.toggle('show',S.checked);
    const wrong=S.checked?T.filter(t=>S.placed[t.id]&&S.placed[t.id]!==t.id):[];
    if(S.checked){el('score').textContent=cnt.ok+' su '+T.length+' giuste';
      el('checkHint').textContent=cnt.ok===T.length?'Perfetto! Premi "Ricomincia" per rigiocare.':'Le etichette rosse mostrano il nome giusto. Premi "Ricomincia" per riprovare.';}
    const er=el('errors');er.innerHTML='';er.classList.toggle('show',wrong.length>0);
    if(wrong.length){const h=document.createElement('h3');h.textContent='Da ripassare';er.appendChild(h);
      wrong.forEach(t=>{const d=document.createElement('div');d.innerHTML='<b>'+esc(byId[S.placed[t.id]].name)+'</b> non è qui: questo è <b>'+esc(t.name)+'</b>';er.appendChild(d);});}
    el('mapHelp').textContent=S.checked?'Premi "Ricomincia" per mescolare le carte e rigiocare.':(S.selected?'Ora tocca '+M.what+' per "'+byId[S.selected].name+'".':'Scegli una carta, poi tocca '+M.what+' sulla mappa. Tocca di nuovo un elemento colorato per riprendere la carta.');
    renderChips();}
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  let start='ch';try{start=localStorage.getItem('chgeo.map')||'ch';}catch(e){}
  setMap(MAPS[start]?start:'ch');
})();
</script>
